<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高客规划宝 — 客户演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif; }

body {
  background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

/* ===== 主布局 ===== */
.demo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 30px 20px;
  height: 100vh;
  justify-content: center;
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== 顶部标题 ===== */
.demo-header {
  text-align: center;
  color: #d4af37;
  margin-bottom: 8px;
}
.demo-header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 4px;
  text-shadow: 0 2px 12px rgba(212,175,55,0.2);
}
.demo-header .subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 6px;
  margin-top: 6px;
}

/* ===== 主要内容区 ===== */
.demo-main {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  position: relative;
  margin-top: 100px;
}

/* ===== 左右导航箭头 ===== */
.nav-arrow {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(212,175,55,0.3);
  background: rgba(255,255,255,0.05);
  color: #d4af37;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  flex-shrink: 0;
  user-select: none;
}
.nav-arrow:hover {
  background: rgba(212,175,55,0.15);
  border-color: #d4af37;
  transform: scale(1.1);
}
.nav-arrow:active { transform: scale(0.95); }

/* ===== 手机框 ===== */
.phone-frame {
  width: 375px;
  height: 760px;
  background: #f6f4f0;
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 3px rgba(212,175,55,0.15),
    0 0 0 6px rgba(0,0,0,0.3),
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 0 0 1px rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 28px;
  background: #1a1a2e;
  border-radius: 0 0 18px 18px;
  z-index: 10;
}
.phone-notch::after {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 10px;
  background: #2a2a4e;
  border-radius: 50%;
}

/* ===== 手机内页面容器 ===== */
.phone-screen {
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  position: relative;
  background: #f6f4f0;
}

/* ===== 屏幕过渡动画 ===== */
.screen-slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: translateX(60px) scale(0.97);
  pointer-events: none;
  overflow-y: auto;
}
.screen-slide.active {
  opacity: 1;
  transform: translateX(0) scale(1);
  pointer-events: auto;
  z-index: 2;
}
.screen-slide.exit-left {
  opacity: 0;
  transform: translateX(-60px) scale(0.97);
}
.screen-slide.exit-right {
  opacity: 0;
  transform: translateX(60px) scale(0.97);
}

/* 隐藏滚动条 */
.screen-slide::-webkit-scrollbar { width: 0; }

/* ===== 页码指示器 ===== */
.demo-dots {
  display: flex;
  gap: 10px;
  align-items: center;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  transition: all 0.3s;
  border: none;
  padding: 0;
}
.dot.active {
  background: #d4af37;
  box-shadow: 0 0 8px rgba(212,175,55,0.5);
  width: 32px;
  border-radius: 5px;
}
.dot:hover { background: rgba(212,175,55,0.5); }

/* ===== 页面描述 ===== */
.page-desc {
  text-align: center;
  max-width: 600px;
}
.page-desc .page-title {
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 6px;
}
.page-desc .page-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  line-height: 1.6;
}

/* 键盘提示 */
.key-hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.2);
  font-size: 12px;
  letter-spacing: 2px;
}

/* ============================
   手机内各页面样式
   ============================ */

/* --- 全局 --- */
.page-inner {
  padding: 36px 16px 70px;
  min-height: 100%;
  background: #f6f4f0;
  font-size: 14px;
  color: #2c2c2c;
}

/* --- 首页 --- */
.home-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-top: 8px;
}
.home-header .logo {
  font-size: 18px;
  font-weight: 700;
  color: #2c2c2c;
}
.home-header .logo span { color: #b8912e; }
.home-header .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #b8912e, #d4af37);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}
.home-greeting {
  font-size: 13px;
  color: #8a8a8a;
  margin-bottom: 16px;
}
.home-greeting strong { color: #2c2c2c; }

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.home-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px 8px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  cursor: pointer;
  transition: transform 0.2s;
}
.home-card .icon {
  width: 36px;
  height: 36px;
  margin: 0 auto 8px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.home-card .label { font-size: 11px; color: #2c2c2c; white-space: nowrap; }
.home-card .badge {
  font-size: 9px;
  color: #b8912e;
  margin-top: 3px;
}

.home-banner {
  background: linear-gradient(135deg, #b8912e, #d4af37);
  border-radius: 12px;
  padding: 16px;
  color: #fff;
  margin-bottom: 16px;
}
.home-banner .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.home-banner .desc { font-size: 11px; opacity: 0.9; }

/* --- 底部Tab栏 --- */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: #fff;
  display: flex;
  border-top: 1px solid #eee;
  z-index: 5;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  color: #8b8794;
  cursor: pointer;
}
.tab-item.active { color: #b8912e; }
.tab-item .tab-icon {
  font-size: 18px;
  line-height: 1;
}

/* --- 客户列表 --- */
.customer-search {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.customer-search input {
  flex: 1;
  border: none;
  background: #fff;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  outline: none;
}
.customer-search .filter-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  cursor: pointer;
}

.risk-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.risk-tab {
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 11px;
  background: #fff;
  color: #8b8794;
  cursor: pointer;
  border: 1px solid #eee;
  white-space: nowrap;
}
.risk-tab.active { background: #b8912e; color: #fff; border-color: #b8912e; }

.customer-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.customer-card .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.customer-card .name { font-weight: 600; font-size: 14px; }
.customer-card .status {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
}
.status-active { background: #e8f5e9; color: #2e7d32; }
.status-pending { background: #fff3e0; color: #e65100; }
.status-done { background: #e3f2fd; color: #1565c0; }

.customer-card .tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin: 4px 0;
}
.customer-card .tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
}
.tag-red { background: #fce4ec; color: #c62828; }
.tag-gold { background: #fff8e1; color: #b8912e; }
.tag-green { background: #e8f5e9; color: #2e7d32; }

.customer-card .risk-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.risk-bar {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: #eee;
  overflow: hidden;
}
.risk-bar .fill {
  height: 100%;
  border-radius: 3px;
}
.risk-bar .fill.high { background: #e85d5d; }
.risk-bar .fill.medium { background: #ef9f27; }
.risk-bar .fill.low { background: #4ade80; }

.risk-score { font-size: 12px; font-weight: 600; }
.stars { color: #b8912e; font-size: 10px; }

/* --- 话术库 --- */
.script-categories {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.script-cat {
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 11px;
  background: #fff;
  color: #8b8794;
  cursor: pointer;
  border: 1px solid #eee;
  white-space: nowrap;
}
.script-cat.active { background: #b8912e; color: #fff; border-color: #b8912e; }

.script-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  cursor: pointer;
}
.script-card .title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.script-card .title .lock { color: #b8912e; font-size: 12px; }
.script-card .summary { font-size: 11px; color: #8a8a8a; line-height: 1.4; }
.script-card .bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
}
.script-card .category-label {
  font-size: 10px;
  background: #fff8e1;
  color: #b8912e;
  padding: 2px 8px;
  border-radius: 8px;
}
.script-card .vip-tag {
  font-size: 10px;
  color: #b8912e;
}

/* --- 我的 / 权益 --- */
.membership-header {
  background: linear-gradient(135deg, #b8912e, #d4af37);
  margin: -36px -16px 16px;
  padding: 56px 16px 20px;
  color: #fff;
  text-align: center;
}
.membership-header .level {
  font-size: 20px;
  font-weight: 700;
}
.membership-header .hint {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 4px;
}

.feature-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.feature-item {
  background: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.feature-item .ficon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #fff8e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #b8912e;
  flex-shrink: 0;
}
.feature-item .finfo { flex: 1; }
.feature-item .finfo .fname { font-size: 14px; font-weight: 600; }
.feature-item .finfo .fdesc { font-size: 11px; color: #8a8a8a; margin-top: 2px; }
.feature-item .farrow { color: #ccc; font-size: 16px; }

/* --- KYC问卷 --- */
.kyc-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.kyc-progress .bar {
  flex: 1;
  height: 6px;
  background: #e0e0e0;
  border-radius: 3px;
  overflow: hidden;
}
.kyc-progress .fill {
  height: 100%;
  background: linear-gradient(90deg, #b8912e, #d4af37);
  border-radius: 3px;
}
.kyc-progress .step-num { font-size: 11px; color: #b8912e; font-weight: 600; }

.kyc-question {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.kyc-question .qnum {
  font-size: 11px;
  color: #b8912e;
  font-weight: 600;
  margin-bottom: 8px;
}
.kyc-question .qtext {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 16px;
}

.kyc-options { display: flex; flex-direction: column; gap: 8px; }
.kyc-option {
  padding: 12px 14px;
  border: 1.5px solid #eee;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.kyc-option:hover { border-color: #d4af37; }
.kyc-option.selected {
  border-color: #b8912e;
  background: #fff8e1;
}

.kyc-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #b8912e, #d4af37);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  margin-top: 16px;
  cursor: pointer;
}

/* --- 诊断报告 --- */
.report-score {
  text-align: center;
  padding: 20px 0;
  margin-bottom: 16px;
}
.report-score .score-circle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 4px solid #e85d5d;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  font-size: 28px;
  font-weight: 700;
  color: #e85d5d;
}
.report-score .score-label { font-size: 13px; color: #8a8a8a; }
.report-score .score-level {
  font-size: 11px;
  color: #e85d5d;
  font-weight: 600;
  margin-top: 4px;
}

.radar-container {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.radar-container .radar-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
}
.radar-svg { width: 100%; height: 160px; }

.dim-list { display: flex; flex-direction: column; gap: 8px; }
.dim-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.dim-item .dlabel { font-size: 12px; color: #2c2c2c; width: 56px; flex-shrink: 0; }
.dim-item .dbar {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: #eee;
  overflow: hidden;
}
.dim-item .dbar .fill { height: 100%; border-radius: 4px; }
.dim-item .dscore { font-size: 11px; font-weight: 600; width: 28px; text-align: right; }

/* --- 财富对比 --- */
.compare-header {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.compare-tab {
  flex: 1;
  text-align: center;
  padding: 8px;
  border-radius: 10px;
  background: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.compare-tab.active { background: #b8912e; color: #fff; }

.chart-area {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.chart-area .chart-title {
  font-size: 12px;
  color: #8a8a8a;
  margin-bottom: 8px;
}
.chart-svg { width: 100%; height: 180px; }

.compare-legend {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 12px;
  font-size: 11px;
  color: #8a8a8a;
}
.compare-legend .legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.compare-legend .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.compare-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.compare-stat {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.compare-stat .num {
  font-size: 18px;
  font-weight: 700;
  color: #b8912e;
}
.compare-stat .label { font-size: 11px; color: #8a8a8a; margin-top: 2px; }

/* --- 方案配置 --- */
.solution-list { display: flex; flex-direction: column; gap: 10px; }
.solution-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  cursor: pointer;
}
.solution-card .stop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.solution-card .stitle {
  font-size: 14px;
  font-weight: 600;
}
.solution-card .smatch {
  font-size: 11px;
  font-weight: 600;
  color: #b8912e;
  background: #fff8e1;
  padding: 2px 8px;
  border-radius: 8px;
}
.solution-card .sdesc { font-size: 11px; color: #8a8a8a; line-height: 1.4; }
.solution-card .sbottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
}
.solution-card .surgency {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
}
.surgency-high { background: #fce4ec; color: #c62828; }
.surgency-medium { background: #fff8e1; color: #b8912e; }
.surgency-low { background: #e8f5e9; color: #2e7d32; }
.solution-card .stools { font-size: 10px; color: #8a8a8a; }

/* --- 客户详情 --- */
.detail-header {
  background: linear-gradient(135deg, #b8912e, #d4af37);
  margin: -36px -16px 16px;
  padding: 56px 16px 20px;
  color: #fff;
}
.detail-header .dname { font-size: 18px; font-weight: 700; }
.detail-header .dsub {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 4px;
  display: flex;
  gap: 12px;
}

.detail-info {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.detail-info .info-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
}
.detail-info .info-row + .info-row { border-top: 1px solid #f0f0f0; }
.detail-info .info-label { color: #8a8a8a; }
.detail-info .info-value { font-weight: 500; }

.detail-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.detail-action {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  cursor: pointer;
}
.detail-action .aicon { font-size: 22px; margin-bottom: 4px; }
.detail-action .alabel { font-size: 12px; color: #2c2c2c; }

/* ===== 响应式 ===== */

    });
  } else {
    tabBar.style.display = 'none';
  }

  document.getElementById('pageTitle').textContent = page.title;
  document.getElementById('pageSubtitle').textContent = page.subtitle;
  updateDots(index);
}

function updateDots(index) {
  var container = document.getElementById('dotsContainer');
  var html = '';
  for (var i = 0; i < PAGES.length; i++) {
    html += '<button class="dot'+(i===index?' active':'')+'" data-index="'+i+'"></button>';
  }
  container.innerHTML = html;
  container.querySelectorAll('.dot').forEach(function(dot){
    dot.addEventListener('click', function(){
      goTo(parseInt(this.dataset.index));
    });
  });
}

function goTo(index) {
  if (index < 0 || index >= PAGES.length) return;
  currentPage = index;
  renderPage(currentPage);
}

// =============================================
// 事件绑定
// =============================================
document.getElementById('prevBtn').addEventListener('click', function(){
  if (currentPage > 0) goTo(currentPage - 1);
});
document.getElementById('nextBtn').addEventListener('click', function(){
  if (currentPage < PAGES.length - 1) goTo(currentPage + 1);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft') {
    if (currentPage > 0) goTo(currentPage - 1);
  } else if (e.key === 'ArrowRight') {
    if (currentPage < PAGES.length - 1) goTo(currentPage + 1);
  }
});

// =============================================
// 启动
// =============================================
renderPage(0);
</script>
</body>
</html>
